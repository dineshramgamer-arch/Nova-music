<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in · Nova Music</title><link rel="stylesheet" href="/style.css"></head><body><div class="auth-page"><div class="auth-art"><div class="big-note">♫</div></div><main class="auth-box"><a class="brand" href="/"><span class="brandmark">♫</span><span>NOVA<span class="muted">MUSIC</span></span></a><div class="eyebrow">YOUR MUSIC, YOUR WAY</div><h1 id="heading">Welcome back.</h1><p id="sub">Sign in or create an account to make your music space personal.</p><a class="google" href="/api/auth/google/start?next=/" style="background:#f8f9fb;color:#222;text-decoration:none"><b style="font-size:18px">G</b> Continue with Google</a><div style="display:flex;align-items:center;gap:12px;color:#667080;font-size:11px;margin:15px 0"><span style="height:1px;background:#29313c;flex:1"></span>OR CONTINUE WITH EMAIL<span style="height:1px;background:#29313c;flex:1"></span></div><form id="loginForm"><input id="email" type="email" placeholder="Email address" autocomplete="username webauthn" required><input id="code" inputmode="numeric" placeholder="6-digit email code" autocomplete="one-time-code" maxlength="6" hidden><button class="submit" id="submit" type="submit">Send sign-in code</button><button id="back" type="button" hidden style="background:transparent;color:#b2bdca">Use another email</button></form><div id="message" class="auth-msg" role="status"></div><div class="auth-back"><a href="/">← Back to Nova Music</a></div></main></div><script>
(function(){const A=window.hatchable&&window.hatchable.auth;const form=document.querySelector("#loginForm"),email=document.querySelector("#email"),code=document.querySelector("#code"),submit=document.querySelector("#submit"),back=document.querySelector("#back"),message=document.querySelector("#message");let step="email";function say(t){message.textContent=t}function next(){const n=new URLSearchParams(location.search).get("next")||"/";location.replace(n.startsWith("/")&&!n.startsWith("//")?n:"/")}if(!A){say("Sign-in is temporarily unavailable. Refresh this page.");return}A.getSession().then(s=>{if(s&&s.user)next()}).catch(()=>{});form.addEventListener("submit",async e=>{e.preventDefault();submit.disabled=true;try{if(step==="email"){await A.startLogin({email:email.value.trim()});step="code";code.hidden=false;back.hidden=false;submit.textContent="Verify code";say("A sign-in code has been sent if this address can sign in.");code.focus()}else{await A.verifyCode({email:email.value.trim(),code:code.value.trim()});say("Signed in. Opening Nova Music…");next()}}catch(err){say(err&&err.status===429?"Too many attempts. Wait a moment and try again.":(err.message||"Could not complete sign-in."))}finally{submit.disabled=false}});back.onclick=()=>{step="email";code.hidden=true;back.hidden=true;submit.textContent="Send sign-in code";code.value="";say("")};})();
</script></body></html>
